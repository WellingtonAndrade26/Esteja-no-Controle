name: Recuperar site Prisma publicado

on:
  push:
    branches:
      - feature/enc-v2.1-auth-hardening
    paths:
      - '.github/workflows/recover-prisma-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Baixar arquivos publicos do Cloudflare
        shell: bash
        env:
          SITE: https://controle.wadigitallabs.com
        run: |
          set -euo pipefail
          mkdir -p prisma-live
          cat > /tmp/paths.txt <<'FILES'
          index.html
          access.js
          app.js
          store.js
          styles.css
          cards.css
          config.js
          sw.js
          manifest.json
          vendor/auth.js
          ui/views.js
          ui/forms.js
          ui/cards.js
          ui/planning.js
          ui/html.js
          domain/base.js
          domain/book.js
          domain/commands.js
          domain/copilot.js
          domain/demo.js
          domain/engine.js
          domain/language.js
          open-finance/provider.js
          open-finance/reconciliation.js
          assets/ec-logo.webp
          assets/ec-apple.png
          assets/ec-192.png
          assets/ec-512.png
          assets/ec-32.png
          assets/ec-maskable-512.png
          assets/icon-192.png
          assets/icon-512.png
          assets/icon-maskable-512.png
          assets/geist-latin.woff2
          assets/wa-prisma-160.webp
          assets/wa-prisma-96.webp
          assets/arco-prisma.svg
          assets/OFL-Geist.txt
          FILES
          required=' index.html access.js app.js store.js styles.css cards.css config.js sw.js manifest.json vendor/auth.js assets/ec-logo.webp '
          : > prisma-live/ARQUIVOS_AUSENTES.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "prisma-live/$(dirname "$path")"
            status=$(curl -L -sS --retry 2 --retry-delay 2 --max-time 35 -w '%{http_code}' -o "prisma-live/$path" "$SITE/$path") || status='000'
            if [ "$status" != '200' ]; then
              rm -f "prisma-live/$path"
              echo "$path HTTP $status" >> prisma-live/ARQUIVOS_AUSENTES.txt
              case "$required" in *" $path "*) echo "Arquivo essencial indisponivel: $path"; exit 1;; esac
              continue
            fi
            case "$path" in
              *.js|*.html|*.css|*.json)
                if [ ! -s "prisma-live/$path" ]; then echo "Arquivo vazio: $path"; exit 1; fi
                if [ "$path" != 'index.html' ] && head -c 150 "prisma-live/$path" | grep -iqE '^<!DOCTYPE html|^<html'; then
                  echo "Resposta inesperada de HTML: $path"; exit 1
                fi
                ;;
            esac
            echo "Recuperado $path: $(wc -c < "prisma-live/$path") bytes"
          done < /tmp/paths.txt
          cat > prisma-live/LEIA-ME-RECUPERACAO.txt <<'NOTE'
          Esteja no Controle — snapshot dos arquivos publicos servidos pelo Cloudflare Pages.
          Origem: https://controle.wadigitallabs.com/
          Inclui: HTML, CSS, JS, fontes, icones e manifesto encontrados.
          Nao inclui codigo do backend, banco Supabase, segredos ou arquivos originais nao publicados.
          O fluxo de recuperacao de senha ainda precisa ser homologado antes de publicar.
          NOTE
          sha256sum prisma-live/index.html prisma-live/access.js prisma-live/app.js > prisma-live/SHA256.txt
          (cd prisma-live && zip -q -r ../Esteja-no-Controle-Prisma-Cloudflare-Recuperado.zip .)
          unzip -t Esteja-no-Controle-Prisma-Cloudflare-Recuperado.zip | tail -1
      - name: Guardar ZIP recuperado
        uses: actions/upload-artifact@v4
        with:
          name: Esteja-no-Controle-Prisma-Cloudflare-Recuperado
          path: Esteja-no-Controle-Prisma-Cloudflare-Recuperado.zip
          if-no-files-found: error
          retention-days: 90
